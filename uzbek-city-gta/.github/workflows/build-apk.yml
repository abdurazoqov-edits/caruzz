name: Build Uzbek City GTA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Copy Three.js Draco Decoders (Offline GLB Support)
        run: |
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/* public/draco/

      - name: Build Vite Web Bundle
        run: npm run build

      - name: Ensure Draco & Models in dist
        run: |
          mkdir -p dist/draco
          cp -r public/draco/* dist/draco/
          ls -la dist/draco
          ls -la dist/models || true

      - name: Add & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest Orientation & Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()

          if 'android:hardwareAccelerated' not in xml:
              xml = xml.replace('<application', '<application android:hardwareAccelerated="true"', 1)

          if 'android:screenOrientation=' in xml:
              xml = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="fullSensor"', xml)
          else:
              xml = xml.replace('<activity', '<activity\n            android:screenOrientation="fullSensor"', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)
          print("Updated AndroidManifest.xml successfully.")
          EOF

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-City-GTA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
